syntax = "proto2";

package apollo.perception.lidar.centerpoint;

import "modules/perception/common/proto/model_info.proto";
import "modules/perception/common/proto/model_process.proto";
import "modules/perception/common/proto/plugin_param.proto";

message ProposalRefineParam {
  optional bool enable_proposal_refine = 1 [default = false];
  optional string proposal_refine_mode = 2 [default = "mock_zero"];
  optional int32 proposal_refine_top_k = 3 [default = -1];
  optional float proposal_refine_score_threshold = 4 [default = 0.0];
  optional float proposal_refine_delta_scale = 5 [default = 1.0];
  optional string proposal_refine_model_path = 6 [default = ""];
  optional string proposal_refine_metadata_path = 7 [default = ""];
  optional bool proposal_refine_debug_log = 8 [default = false];
  optional bool strict_refine = 9 [default = true];
}

message ProposalExportParam {
  optional bool enable_proposal_export = 1 [default = false];
  optional string proposal_export_path = 2
      [default = "/apollo/data/perception/proposal_export"];
  optional int32 proposal_export_top_k = 3 [default = -1];
  optional float proposal_export_min_score = 4 [default = 0.0];
  optional int32 proposal_export_max_frames = 5 [default = -1];
  optional bool proposal_export_debug_csv = 6 [default = false];
  optional bool strict_export = 7 [default = false];
}

message ModelParam {
  optional common.ModelInfo info = 1;
  optional common.PointCloudPreProcess preprocess = 2;
  optional common.PointCloudPostProcess postprocess = 3;
  optional common.PaddleSettings paddle_settings = 4;
  optional int32 point2box_max_num = 5;
  optional float quantize = 6;
  optional bool filter_by_points = 7;
  optional int32 min_points_threshold = 8;
  optional bool diff_class_nms = 9 [default = true];
  optional float diff_class_iou = 10 [default = 0.25];
  optional bool nms_strategy = 11 [default = true];
  optional bool filter_by_semantic_type = 12 [default = false];
  optional bool filter_ground_points = 13 [default = false];
  optional PluginParam plugins = 14;
  optional ProposalRefineParam proposal_refine = 15;
  optional ProposalExportParam proposal_export = 16;
}
